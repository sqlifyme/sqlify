[project]
name = "sqlify"
version = "0.1.0"
description = "PostgreSQL compatible database on top of sqletl"
authors = [
    {"name" = "Maxime Bouroumeau-Fuseau", email = "maxime.bouroumeau@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "sqletl~=0.1",
    "postgres-proto~=0.1",
    "dataclasses-json~=0.6"
]

[project.urls]
Repository = "https://github.com/sqlify/sqlify"

[project.scripts]
sqlify = "sqlify.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.4",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
postgres-proto = { path = "../postgres-proto/", editable = true }
sqletl = { path = "../sqletl", editable = true }